# React Router handles client-side navigation (BrowserRouter): without
# this rule, reloading the page on /prediction or sharing that link
# would return an nginx 404 instead of serving the application (which,
# once loaded, knows itself how to show the right page).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Files compiled by Vite (JS/CSS with a hash in the name): can be
    # cached for a long time without risk of serving a stale version.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
