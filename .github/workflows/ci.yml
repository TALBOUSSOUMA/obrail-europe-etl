name: CI

# Triggered on every push and every pull request to main, to prevent
# merging a change that breaks the tests or the build (the "CI/CD
# pipeline" deliverable of the TPRE532 specifications).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ------------------------------------------------------------------
  # 1. Backend tests: recreates a real Postgres database, replays the
  #    full ETL process from the real data versioned in data/raw/, then
  #    runs the API's integration tests against that database - exactly
  #    the same principle as locally (see api/tests/conftest.py).
  # ------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: obrail
          POSTGRES_PASSWORD: obrail
          POSTGRES_DB: obrail
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U obrail -d obrail"
          --health-interval=5s --health-timeout=5s --health-retries=10

    env:
      POSTGRES_USER: obrail
      POSTGRES_PASSWORD: obrail
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: obrail

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ETL + API + ML (inference) dependencies
        run: |
          pip install -r requirements.txt
          pip install -r api/requirements.txt
          pip install -r ml/requirements-predict.txt

      - name: Load the schema (PDM)
        run: PGPASSWORD=obrail psql -h localhost -U obrail -d obrail -f sql/init_db.sql

      - name: Run the ETL pipeline (versioned real data)
        working-directory: etl
        run: python run_pipeline.py

      - name: Run backend tests (pytest)
        working-directory: api
        run: pytest -v

  # ------------------------------------------------------------------
  # 2. Frontend: installs dependencies and checks that the production
  #    build compiles without errors.
  # ------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Production build
        working-directory: frontend
        run: npm run build

  # ------------------------------------------------------------------
  # 3. Docker images: builds the API and frontend images, to guarantee
  #    that an evaluator will indeed be able to build them with
  #    `docker compose up --build`. Doesn't publish them anywhere (no
  #    registry configured): the "provide a testable version" deliverable
  #    is satisfied by the fact that the build succeeds in CI.
  # ------------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f api/Dockerfile -t obrail-api:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t obrail-frontend:ci ./frontend
