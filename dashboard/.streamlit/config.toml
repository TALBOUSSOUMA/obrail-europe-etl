[theme]
# Palette inspired by the ONS (Office for National Statistics, UK) Accessible
# Colours - designed and tested for WCAG AA-compliant contrast and
# distinction for color blindness (deuteranopia/protanopia). Reference to
# cite in the technical report (digital accessibility section).
primaryColor = "#12436D"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F5F7"
textColor = "#1A1A1A"
font = "sans serif"
base = "light"
